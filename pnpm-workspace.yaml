allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@sentry/node-cpu-profiler': true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.110.6'
  - '@supabase/functions-js@2.110.6'
  - '@supabase/postgrest-js@2.110.6'
  - '@supabase/realtime-js@2.110.6'
  - '@supabase/storage-js@2.110.6'
  - '@supabase/supabase-js@2.110.6'

# Mirror npm security overrides for deployments using pnpm.
overrides:
  'proxy-addr': '^2.0.8'
  'qs': '^6.16.0'
  'source-map-js': '^1.2.2'
  'fast-uri': '^3.1.8'
  'browserslist': '^4.28.7'
  'postcss': '^8.5.23'
  'exceljs>uuid': '^11.1.1'
  'hono': '^4.13.7'
  '@hono/node-server': '^1.19.15'
  'deepmerge-ts': '^8.0.2'
  'valibot': '^1.4.2'
  'mysql2': '^3.23.1'
  'multer': '^2.3.0'
  'js-yaml': '^4.3.2'
  'lodash': '^4.17.24'
  'body-parser': '^2.2.2'
  'brace-expansion@<2': '^1.1.21'
  'brace-expansion@>=4': '^5.0.12'
  'dompurify': '^3.4.16'
  'file-type': '^21.3.2'
  'fast-copy': '^4.1.0'
  'ajv@>=7': '^8.18.0'
  'brace-expansion@>=2 <3': '^2.1.7'
  'handlebars': '^4.7.10'
  'picomatch@>=4': '^4.0.7'
  '@angular-devkit/core': '^19.2.24'
  '@angular-devkit/schematics': '^19.2.24'
